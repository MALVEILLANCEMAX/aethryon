[package]
name = "aethryon-setup-ui"
version = "2.0.0-beta.8"
edition = "2021"
description = "AETHRYON Setup : interface (Tauri 2) et modes silencieux"
license = "LicenseRef-AETHRYON-proprietaire"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aethryon-setup-moteur = { path = "../moteur" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[features]
# Construction de production (interface embarquée) : `cargo build --release --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
