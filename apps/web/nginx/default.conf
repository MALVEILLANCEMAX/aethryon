# YouTube Converter 2.0 — site (SPA React), proxy /api vers le service account, fichiers signés.
# Valeurs remplacées à la construction de l'image (Dockerfile, ARG) :
#   __ACCOUNT_UPSTREAM__  hôte:port du service account (préprod : ytc2-pp-account:3000)
#   __REAL_IP_FROM__      réseau du proxy de confiance (préprod : 127.0.0.1/32 ; production : réseau du reverse proxy)
#   __ROBOTS__            valeur de X-Robots-Tag (tout sauf les pages publiques)
#   __ROBOTS_PAGES__      X-Robots-Tag des pages publiques pré-rendues (INDEXING=1 : « index, follow »,
#                         sinon la même valeur que __ROBOTS__)
# Blocs retirés par le Dockerfile selon les arguments : « control-center » (CONTROL_CENTER=0),
# « sans-control-center » (CONTROL_CENTER=1), « indexation » (INDEXING=0, défaut).
#
# Adresses (docs/DEPLOIEMENT.md §12) : chaque page publique a son HTML pré-rendu (vrai contenu sans
# JavaScript) ; les routes de l'application (compte requis) reçoivent la coque neutre app.html ; toute
# autre adresse est une vraie 404 (page 404 pré-rendue). scripts/prerender.mjs vérifie à chaque build que
# ces locations correspondent exactement aux routes de web/src/routes.tsx.

# Journal d'accès sans query string ni Referer : le retour de Google
# (/api/auth/callback/google?state=…&code=…) ne laisse aucun code OAuth dans les journaux.
map $request_uri $ytc_log_path {
    ~^(?<ytc_p>[^?]*) $ytc_p;
}
log_format ytc '$remote_addr [$time_local] "$request_method $ytc_log_path $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# X-Robots-Tag (security-headers.conf) : selon le document RÉELLEMENT servi. $uri est lu à l'envoi des
# en-têtes, APRÈS try_files ou redirection interne : c'est le fichier (/aide/index.html, /404.html,
# /app.html…). Seuls les fichiers des pages publiques pré-rendues reçoivent __ROBOTS_PAGES__ (on n'y
# accède pas directement : /aide/index.html demandé tel quel est une 404).
map $uri $ytc_robots {
    default "__ROBOTS__";
    ~^/(?:aide/|installer/|confidentialite/|connexion/|commencer/|extension/|conditions/|outils/|cgv/|mentions-legales/|remboursement/|premium/)?index\.html$ "__ROBOTS_PAGES__";
    ~^/accueil-solution-[a-z]+\.html$ "__ROBOTS_PAGES__";
}

# Lien direct vers une solution (/?solution=extension#solutions, web/src/landing/Solutions.tsx) : l'accueil
# pré-rendu avec cet onglet ouvert. Même règle que l'application : valeur exacte, sensible à la casse
# (expressions « ~ » : les chaînes simples d'une map sont comparées sans tenir compte de la casse) ;
# toute autre valeur → l'accueil. Liste vérifiée à chaque build par scripts/prerender.mjs.
map $arg_solution $ytc_accueil {
    default /index.html;
    ~^extension$ /accueil-solution-extension.html;
    ~^discord$ /accueil-solution-discord.html;
    ~^web$ /accueil-solution-web.html;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 32k;
    access_log /var/log/nginx/access.log ytc;

    # IP réelle du visiteur : seulement si la requête vient du proxy de confiance.
    set_real_ip_from __REAL_IP_FROM__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_vary on;

    # Résolution dynamique : nginx démarre même si le service account n'est pas encore prêt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        include /etc/nginx/security-headers.conf;
        set $account http://__ACCOUNT_UPSTREAM__;
        proxy_pass $account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # AETHRYON Music (account/src/music.ts) : correspondances et synchronisation de playlists (500 titres, 10 000
    # fichiers candidats du Desktop) : corps jusqu'à 2 Mio, contrôlés exactement par account.
    location ~ "^/api/music/(correspondances|playlists/synchroniser)$" {
        include /etc/nginx/security-headers.conf;
        client_max_body_size 3m;
        set $account http://__ACCOUNT_UPSTREAM__;
        proxy_pass $account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # AETHRYON Music : fichier d'un import terminé (pièce jointe, jusqu'à 500 Mo), relayé au fil de l'eau.
    location ~ "^/api/music/imports/mus_[A-Za-z0-9_-]{1,44}/fichier$" {
        include /etc/nginx/security-headers.conf;
        set $account http://__ACCOUNT_UPSTREAM__;
        proxy_pass $account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # AETHRYON Tools (docs/OUTILS.md) : morceaux d'un fichier importé (5 Mio chacun, octets bruts), relayés au fil de
    # l'eau à account (aucune mise en tampon sur le disque de nginx, dont /tmp ne fait que 16 Mo). Seule exception à la
    # limite de 32 Ko des corps de requête. Expression régulière : un préfixe terminé par « / » ferait rediriger
    # (301) /api/outils/imports vers /api/outils/imports/.
    location ~ "^/api/outils/imports/[A-Za-z0-9_-]{1,40}/morceaux/[0-9]{1,6}$" {
        include /etc/nginx/security-headers.conf;
        client_max_body_size 6m;
        proxy_request_buffering off;
        set $account http://__ACCOUNT_UPSTREAM__;
        proxy_pass $account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # AETHRYON Tools : lecture dans l'éditeur et téléchargement d'un média, par plages d'octets. Un navigateur qui
    # reprend un fichier déjà en partie dans son cache ajoute If-Range ; ytapi y répondait 500 (KeyError, corrigé dans
    # ytapi le 2026-10-15) et le lecteur restait vide. Le fichier d'un job ne change jamais : la plage seule suffit,
    # If-Range n'est pas transmis.
    location ~ "^/api/outils/medias/[A-Za-z0-9_-]{1,40}/(flux|fichier)$" {
        include /etc/nginx/security-headers.conf;
        set $account http://__ACCOUNT_UPSTREAM__;
        proxy_pass $account;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header If-Range "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # >>> control-center : bloc retiré par le Dockerfile si CONTROL_CENTER=0 (/admin = page de l'application)
    # ---- Control Center (/admin) -------------------------------------------------------------
    # Le rôle est vérifié par account AVANT de servir l'application (docs/ADMIN.md §2) :
    #   204 (admin) → app.html ; 401 (pas de session) → /connexion ; 403 (pas admin) → app.html
    #   avec le statut 403 (React affiche « Accès réservé ») ; account injoignable → 503 + app.html
    #   (React propose de réessayer). La vraie protection reste la garde de /api/admin/* côté serveur.
    #   app.html : coque neutre (racine vide) ; index.html est la page d'accueil pré-rendue.
    location = /admin {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
        auth_request /_auth/admin-session;
        error_page 401 = @admin_login;
        error_page 403 /app.html;
        error_page 500 502 503 504 =503 /app.html;
        try_files /app.html =404;
    }
    location /admin/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
        auth_request /_auth/admin-session;
        error_page 401 = @admin_login;
        error_page 403 /app.html;
        error_page 500 502 503 504 =503 /app.html;
        try_files /app.html =404;
    }
    # Sous-requête interne : GET /api/admin/session avec le cookie d'origine, sans corps.
    location = /_auth/admin-session {
        internal;
        set $account_session http://__ACCOUNT_UPSTREAM__/api/admin/session;
        proxy_pass $account_session;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    # Sans session : vers la connexion, retour au Control Center ensuite (redirection relative).
    location @admin_login {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        absolute_redirect off;
        return 302 /connexion?suite=/admin;
    }
    # <<< control-center

    # >>> sans-control-center : bloc retiré par le Dockerfile si CONTROL_CENTER=1 (bloc ci-dessus)
    # Ancienne page /admin (dans la coque du site) : route de l'application, coque neutre.
    location = /admin { include /etc/nginx/html.conf; try_files /app.html =404; }
    # <<< sans-control-center

    # Fichiers hachés produits par Vite (nom = empreinte du contenu) : cache long, et CONSERVÉS d'une mise en ligne
    # à l'autre. Un onglet ouvert avant un déploiement demande encore les fichiers de SA version : s'ils ne sont plus
    # dans l'image, ils sont servis depuis l'archive (volume ytc-web-assets, rempli par deploy/web-assets-archive.sh
    # avec les fichiers des images précédentes ; même nom = même contenu, aucun mélange possible). Incident du
    # 2026-10-14 : « Failed to fetch dynamically imported module » (AdminLayout-YdrZktwS.js). Cache « immutable »
    # SEULEMENT sur une vraie réponse (add_header sans « always ») : une 404 n'est jamais gardée en cache, et c'est
    # un texte court, jamais une page HTML (un module JavaScript attendu ne reçoit pas index.html).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET HEAD { deny all; }
        error_page 404 = @asset_absent;
        try_files $uri @asset_archive;
    }
    location @asset_archive {
        root /usr/share/nginx/archive;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @asset_absent;
    }
    location @asset_absent {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        types { } default_type text/plain;   # sinon le type viendrait de l'extension demandée (.js)
        return 404 "Fichier introuvable.\n";
    }
    # Identifiant de la construction en ligne (src/lib/version.ts) : jamais en cache.
    location = /version.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
        default_type application/json;
        try_files /version.json =404;
    }

    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_except GET HEAD { deny all; }
        error_page 404 = @asset_absent;
        try_files $uri =404;
    }

    # Ancien lien public (raccourci v1, défaillant) : renvoie vers le raccourci AETHRYON (v3), validé sur iPhone.
    location = /downloads/YouTube-Converter.shortcut {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        absolute_redirect off;  # « Location: /downloads/… » : sinon nginx écrirait son port interne (8080)
        return 302 /downloads/AETHRYON.shortcut;
    }
    # Raccourci v2 en test : lien direct, remplacera le fichier public après validation sur iPhone.
    location = /downloads/YouTube-Converter-v2.shortcut {
        include /etc/nginx/security-headers.conf;
        types { } default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="YouTube Converter v2.shortcut"' always;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
    }
    # Raccourci AETHRYON (v3) : fichier public (bouton « Installer » et ancien lien).
    location = /downloads/AETHRYON.shortcut {
        include /etc/nginx/security-headers.conf;
        types { } default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="AETHRYON.shortcut"' always;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
    }
    location = /downloads/YouTube-Converter-DEBUG.shortcut {
        include /etc/nginx/security-headers.conf;
        types { } default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="YouTube Converter DEBUG.shortcut"' always;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
    }
    # Extension navigateur, distribution DIRECTE (docs/EXTENSION.md) : fichiers présents seulement si l'image a été
    # construite avec EXTENSION_DOWNLOAD=1 (sinon 404). Archive versionnée, donc immuable ; empreintes et
    # description de la dernière version (lue par l'extension pour signaler une mise à jour) toujours revalidées.
    location ~ "^/downloads/extension/aethryon-extension-[0-9]+\.[0-9]+\.[0-9]+\.zip$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition "attachment" always;
        limit_except GET HEAD { deny all; }
        types { } default_type application/zip;
        try_files $uri =404;
    }
    location = /downloads/extension/SHA256SUMS {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        types { } default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    location = /downloads/extension/latest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        types { } default_type application/json;
        try_files $uri =404;
    }
    # AETHRYON pour Premiere Pro (Windows) : installateur versionné, donc immuable ; empreinte à côté.
    location ~ "^/downloads/premiere/AETHRYON-Setup-[0-9][0-9.]*(-beta\.[0-9]+)?\.exe$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition "attachment" always;
        limit_except GET HEAD { deny all; }
        types { } default_type application/vnd.microsoft.portable-executable;
        try_files $uri =404;
    }
    location = /downloads/premiere/SHA256SUMS {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        types { } default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    # AETHRYON Desktop : annonce de mise à jour (Paramètres › Mises à jour, desktop/noyau/src/maj_desktop.rs), toujours
    # revalidée ; présente seulement si publiée (DESKTOP_MAJ=1, scripts/fetch-downloads.sh), sinon 404.
    location = /downloads/desktop/latest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        types { } default_type application/json;
        charset utf-8;
        try_files $uri =404;
    }
    # Le setup annoncé est le MÊME fichier que /downloads/premiere/ (aucune copie dans l'image), versionné, immuable.
    location ~ "^/downloads/desktop/(AETHRYON-Setup-[0-9][0-9.]*(-beta\.[0-9]+)?\.exe)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition "attachment" always;
        limit_except GET HEAD { deny all; }
        types { } default_type application/vnd.microsoft.portable-executable;
        try_files /downloads/premiere/$1 =404;
    }
    location /downloads/ { return 404; }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        limit_except GET HEAD { deny all; }
    }
    # >>> indexation : bloc retiré par le Dockerfile si INDEXING=0 (défaut) → /sitemap.xml répond 404
    # Plan du site (pages publiques seulement, scripts/prerender.mjs), servi quand l'indexation est ouverte.
    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        try_files /sitemap.xml =404;
    }
    # <<< indexation
    # Médias de l'accueil (refonte V2) : film de marque (MP4, lecture par plages) et affiches des objets rétro.
    # Noms stables, non hachés : cache d'un jour ; 404 si absents ; GET et HEAD seulement.
    location /media/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    # Ressources de la marque AETHRYON (noms stables, non hachés) : cache d'un jour, 404 si absentes.
    location /brand/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
    }
    location = /apple-touch-icon.png {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    # ---- Pages publiques pré-rendues (scripts/prerender.mjs) : leur vrai contenu dès le HTML initial,
    # remplacé ensuite par l'application (même page, sans saut).
    location = / { include /etc/nginx/html.conf; try_files $ytc_accueil =404; }
    location = /aide { include /etc/nginx/html.conf; try_files /aide/index.html =404; }
    location = /installer { include /etc/nginx/html.conf; try_files /installer/index.html =404; }
    location = /extension { include /etc/nginx/html.conf; try_files /extension/index.html =404; }
    location = /conditions { include /etc/nginx/html.conf; try_files /conditions/index.html =404; }
    # Pages juridiques de la vente (src/legal/*.md).
    location = /cgv { include /etc/nginx/html.conf; try_files /cgv/index.html =404; }
    location = /mentions-legales { include /etc/nginx/html.conf; try_files /mentions-legales/index.html =404; }
    location = /remboursement { include /etc/nginx/html.conf; try_files /remboursement/index.html =404; }
    # AETHRYON Premium (offre annuelle) : pré-rendue seulement avec les offres montrées (OFFRES=apercu ou vente), sinon 404.
    # >>> premium (page /premium : seulement si OFFRES ≠ reelles ; retirée par le Dockerfile et simulée par prerender.mjs)
    location = /premium { include /etc/nginx/html.conf; error_page 404 /404.html; try_files /premium/index.html =404; }
    # <<< premium
    # CGV en texte (jointes à la confirmation de commande par account) : absentes tant qu'elles ne sont pas publiées.
    location = /legal/cgv.txt {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        limit_except GET HEAD { deny all; }
        types { } default_type "text/plain; charset=utf-8";
        try_files /legal/cgv.txt =404;
    }
    # AETHRYON Tools : la page publique (pré-rendue) ; l'éditeur (/outils/studio, /outils/studio/<média>) est une route
    # de l'application, plus bas.
    location = /outils { include /etc/nginx/html.conf; try_files /outils/index.html =404; }
    location = /confidentialite { include /etc/nginx/html.conf; try_files /confidentialite/index.html =404; }
    # Création du compte (refonte V2) : distincte de la connexion d'un compte existant.
    location = /commencer { include /etc/nginx/html.conf; try_files /commencer/index.html =404; }
    location = /connexion {
        include /etc/nginx/html.conf;
        # Retour d'une connexion Google en échec (?error=…) : la page affiche un message absent du HTML
        # pré-rendu ; la coque neutre évite que le contenu se décale à l'arrivée du message.
        if ($arg_error != "") { rewrite ^ /app.html last; }
        try_files /connexion/index.html =404;
    }

    # ---- Routes de l'application (compte requis) : coque neutre (racine vide), l'application affiche
    # la page ; jamais le contenu d'une autre page, même un instant. /admin : bloc Control Center.
    location = /dashboard { include /etc/nginx/html.conf; try_files /app.html =404; }
    location = /dashboard/cles { include /etc/nginx/html.conf; try_files /app.html =404; }
    location = /dashboard/activite { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Liaison Discord (docs/DISCORD-BOT.md §17) : page de l'espace, et arrivée d'un lien de téléchargement du bot
    # en échec (?erreur=…, sans connexion). Coque neutre : le contenu dépend du compte ou du paramètre.
    location = /dashboard/discord { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Ton compte : façons de se connecter, mot de passe, données (pas un onglet : carte du compte et guide y mènent).
    location = /dashboard/compte { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Abonnement : offre réelle, quota, offres à venir et « Me prévenir » (rien n'est vendu).
    location = /dashboard/abonnement { include /etc/nginx/html.conf; try_files /app.html =404; }
    # AETHRYON Cloud (administrateur ; account refuse tout autre compte) : CSP qui permet les aperçus depuis le stockage.
    location = /dashboard/cloud { include /etc/nginx/html-cloud.conf; try_files /app.html =404; }
    # AETHRYON Music (tout compte connecté) : CSP qui permet pochettes, aperçus et lecteurs officiels des services.
    location = /dashboard/musique { include /etc/nginx/html-musique.conf; try_files /app.html =404; }
    location = /discord/telechargement { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Inscription par e-mail et mot de passe oublié : pages des liens reçus par e-mail (jeton après le « # », donc
    # jamais dans ce journal) ; coque neutre, le contenu dépend du lien.
    location = /inscription { include /etc/nginx/html.conf; try_files /app.html =404; }
    location = /mot-de-passe { include /etc/nginx/html.conf; try_files /app.html =404; }
    location = /mot-de-passe/nouveau { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Consentement de l'extension navigateur (branche feat/ext-auth, DEPLOIEMENT §14) : coque neutre.
    location = /extension/autoriser { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Page d'accord d'AETHRYON pour Premiere Pro (ouverte par le panneau, ?code=… jamais journalisé) : coque neutre.
    location = /premiere/connecter { include /etc/nginx/html.conf; try_files /app.html =404; }
    location = /desktop/connecter { include /etc/nginx/html.conf; try_files /app.html =404; }
    # Éditeur d'AETHRYON Tools : /outils/studio (lien « Ouvrir dans AETHRYON Tools » du bot, jeton après le « # ») et
    # /outils/studio/<identifiant du média> (compte requis ; le média n'est servi qu'à son propriétaire).
    location = /outils/studio { include /etc/nginx/html.conf; try_files /app.html =404; }
    location /outils/studio/ {
        include /etc/nginx/html.conf;
        error_page 404 /404.html;
        if ($uri !~ "^/outils/studio/[A-Za-z0-9_-]{1,40}$") { return 404; }
        try_files /app.html =404;
    }
    location = /app.html { internal; include /etc/nginx/html.conf; }

    # ---- Toute autre adresse : vraie 404, avec la page 404 pré-rendue. Barre oblique finale retirée
    # d'abord (/aide/ → /aide, comme le routeur de l'application) ; les fichiers du site ont leurs locations.
    location / {
        include /etc/nginx/html.conf;
        absolute_redirect off;
        rewrite ^(/.+)/$ $1 permanent;
        error_page 404 /404.html;
        return 404;
    }
    location = /404.html { internal; include /etc/nginx/html.conf; }
}
