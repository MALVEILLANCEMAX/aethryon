# En-têtes de sécurité de la page AETHRYON Music (/dashboard/musique, tout compte connecté) : les MÊMES que
# security-headers.conf, plus ce qu'une fiche musicale affiche RÉELLEMENT : pochettes des services (img-src), aperçus
# de 30 s d'Apple (iTunes) et de Deezer, fichiers libres lus depuis Wikimedia Commons (media-src), lecteurs officiels
# (frame-src : Spotify, Apple Music, SoundCloud, Deezer, Internet Archive). Aucun script ni feuille de style externes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://i.scdn.co https://*.spotifycdn.com https://*.mzstatic.com https://*.sndcdn.com https://*.dzcdn.net https://archive.org https://*.archive.org https://upload.wikimedia.org; media-src 'self' https://audio-ssl.itunes.apple.com https://*.dzcdn.net https://upload.wikimedia.org; frame-src https://open.spotify.com https://embed.music.apple.com https://w.soundcloud.com https://widget.deezer.com https://archive.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag $ytc_robots always;  # map de default.conf : pages publiques / le reste
