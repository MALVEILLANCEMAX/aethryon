# Documents HTML (pages publiques pré-rendues, coque de l'application, page 404) : en-têtes de sécurité,
# revalidation à chaque visite (le HTML change à chaque mise en ligne), GET et HEAD seulement.
include /etc/nginx/security-headers.conf;
add_header Cache-Control "no-cache" always;
limit_except GET HEAD { deny all; }
