# En-têtes de sécurité de la page AETHRYON Cloud (/dashboard/cloud, administrateur seulement) : les MÊMES que
# security-headers.conf, sauf la lecture des aperçus (vidéo, audio, GIF) par lien signé depuis le stockage Backblaze B2
# (img-src et media-src). Aucun script ni aucune feuille de style externes. Changer de fournisseur (R2) : changer l'hôte ici.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' https://*.backblazeb2.com; media-src 'self' blob: https://*.backblazeb2.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag $ytc_robots always;  # map de default.conf : pages publiques / le reste
