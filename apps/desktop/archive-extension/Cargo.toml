[package]
name = "aethryon-archive-extension"
version = "1.0.0"
edition = "2021"
description = "Vérification de l'extension navigateur AETHRYON (latest.json, empreinte, contenu de l'archive, identifiant de production), partagée par AETHRYON Desktop et AETHRYON Setup"
license = "LicenseRef-AETHRYON-proprietaire"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
