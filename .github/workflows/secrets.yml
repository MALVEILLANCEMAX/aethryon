# Secret scanning of the whole Git history with the official gitleaks image (no licence key, no token needed).
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
      - name: gitleaks (working tree, including untracked build inputs)
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner
