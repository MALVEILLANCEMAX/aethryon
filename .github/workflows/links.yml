# Documentation links: relative links on every change, external links once a week.
name: Links

on:
  pull_request:
    paths: ["**/*.md"]
  push:
    branches: [main]
    paths: ["**/*.md"]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Relative links (offline)
        if: github.event_name != 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules --exclude-path apps/web/src/legal './**/*.md'
          fail: true
      - name: All links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,204,206,301,302,403,429 --exclude 'github\.com/MALVEILLANCEMAX/aethryon/(actions|security)' --exclude-path node_modules --exclude-path apps/web/src/legal './**/*.md'
          fail: true
